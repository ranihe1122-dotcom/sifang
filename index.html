<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>晏朝末年 · 四方势力</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #eee5d4;
      --paper: #fbf3e4;
      --ink: #241d18;
      --muted: #675b50;
      --line: #c9b895;
      --dark: #241d18;
      --accent: #7f362b;
      --accent-soft: #caa28f;
      --gold: #9a743c;
      --shadow: 0 14px 30px rgba(43, 32, 22, 0.10);
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { scroll-behavior: smooth; }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: transparent;
    }

    .hero-card,
    .faction-card,
    .detail-panel,
    .panel {
      background-color: rgba(251, 243, 228, 0.86);
      box-shadow:
        0 10px 24px rgba(43, 32, 22, 0.08),
        inset 0 0 0 1px rgba(255,255,255,0.25);
    }

    h1, h2, .faction-name, .detail-panel h3 {
      text-shadow: 0 1px 0 rgba(255,255,255,0.38);
    }

    h1::after,
    h2::after {
      content: "";
      display: block;
      width: 72px;
      height: 2px;
      margin-top: 16px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0.55;
    }

    .faction-card {
      border-radius: 8px;
    }

    .tag,
    .keyword {
      border: 1px solid rgba(127, 54, 43, 0.08);
    }


    body {
      font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.8;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(139, 105, 56, 0.12), transparent 34rem),
        linear-gradient(135deg, rgba(243, 235, 221, 0.92), rgba(232, 220, 201, 0.92));
      background-size: auto, auto, 96px 96px;
      background-attachment: fixed;
    }


    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(70, 52, 35, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(70, 52, 35, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent 85%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hero-card::before,
    .detail-panel::before,
    .faction-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: transparent;
    }

    .detail-panel,
    .faction-card {
      position: relative;
      overflow: hidden;
    }

    .detail-panel > *,
    .faction-card > * {
      position: relative;
      z-index: 1;
    }


    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(18px);
      background: rgba(238, 229, 212, 0.82);
      border-bottom: 1px solid rgba(213, 197, 173, 0.8);
    }

    .nav {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--dark);
      color: var(--paper);
      font-size: 17px;
      box-shadow: 0 6px 18px rgba(45, 34, 24, 0.2);
    }

    .brand-mark i {
      line-height: 1;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    .nav-links a,
    .theme-toggle {
      padding: 8px 12px;
      border-radius: 999px;
      transition: 180ms ease;
    }

    .nav-links a:hover,
    .theme-toggle:hover {
      background: rgba(127, 54, 43, 0.09);
      color: var(--accent);
    }

    .theme-toggle {
      border: 1px solid rgba(141, 63, 47, 0.18);
      background: rgba(255, 250, 240, 0.6);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .hero {
      min-height: 72vh;
      display: grid;
      place-items: center;
      padding: 72px 0 56px;
    }

    .hero-card {
      width: 100%;
      border: 1px solid rgba(148, 119, 77, 0.34);
      background:
        linear-gradient(rgba(251, 243, 228, 0.88), rgba(251, 243, 228, 0.95));
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: clamp(28px, 5vw, 64px);
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "晏 · 朔 · 淮 · 烛";
      position: absolute;
      right: 28px;
      bottom: 16px;
      color: rgba(44, 36, 29, 0.08);
      font-size: clamp(36px, 9vw, 112px);
      letter-spacing: 0.1em;
      white-space: nowrap;
      pointer-events: none;
    }

    .eyebrow {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--accent);
      letter-spacing: 0.22em;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 86px);
      line-height: 1.05;
      letter-spacing: 0.12em;
      margin-bottom: 26px;
      font-weight: 800;
    }

    .hero-summary {
      max-width: 760px;
      font-size: clamp(17px, 2vw, 21px);
      color: #40352d;
      position: relative;
      z-index: 1;
    }

    .hero-actions {
      margin-top: 34px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 11px 18px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      border: 1px solid var(--accent);
      transition: 180ms ease;
    }

    .btn.primary {
      background: var(--accent);
      color: var(--paper);
    }

    .btn.secondary {
      background: rgba(255, 250, 240, 0.74);
      color: var(--accent);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(45, 34, 24, 0.13);
    }

    section { padding: 42px 0; }

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .sub-note {
      margin-top: 8px;
      color: var(--muted);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
    }

    h2 {
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 0.12em;
      line-height: 1.2;
    }

    .faction-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .faction-card {
      background: rgba(255, 250, 240, 0.82);
      border: 1px solid rgba(148, 119, 77, 0.36);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 8px 20px rgba(43, 32, 22, 0.07);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 260px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: 220ms ease;
    }

    .faction-card:hover,
    .faction-card.active {
      transform: translateY(-5px);
      border-color: rgba(141, 63, 47, 0.45);
      box-shadow: var(--shadow);
    }

    .faction-card::before {
      content: "";
      position: absolute;
      right: 12px;
      top: 12px;
      width: 128px;
      height: 128px;
      background-image: var(--seal-url);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.08;
      pointer-events: none;
    }

    .faction-name {
      font-size: 28px;
      letter-spacing: 0.16em;
      font-weight: 800;
      position: relative;
      z-index: 1;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(127, 54, 43, 0.09);
      color: var(--accent);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }

    .faction-card dl {
      display: grid;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .faction-card dt {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--gold);
      font-weight: 700;
    }

    .faction-card dd {
      color: #3e332b;
      font-size: 15px;
    }


    .faction-brief {
      color: #3e332b;
      font-size: 15px;
      position: relative;
      z-index: 1;
    }

    .faction-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      position: relative;
      z-index: 1;
      margin-top: auto;
    }

    .keyword {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(178, 138, 74, 0.12);
      color: var(--gold);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 12px;
      font-weight: 700;
    }


    .open-hint {
      margin-top: auto;
      color: var(--accent);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      font-weight: 700;
      position: relative;
      z-index: 1;
      opacity: 0.85;
    }

    .quote {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(213, 197, 173, 0.75);
      color: var(--accent);
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .resource-panel {
      display: block;
    }

    .panel,
    .detail-panel {
      background: rgba(255, 250, 240, 0.82);
      border: 1px solid rgba(148, 119, 77, 0.36);
      border-radius: var(--radius);
      box-shadow: 0 8px 20px rgba(43, 32, 22, 0.07);
      padding: 24px;
    }

    .resource-list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .resource-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px dashed rgba(113, 103, 93, 0.28);
      padding-bottom: 10px;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .resource-item strong { color: var(--ink); }

    .resource-item span {
      color: var(--accent);
      font-weight: 700;
    }


    .detail-panel h3 {
      font-size: 34px;
      letter-spacing: 0.12em;
      margin-bottom: 10px;
    }

    .detail-meta {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .detail-box {
      border-radius: 8px;
      background: rgba(244, 239, 230, 0.72);
      padding: 16px;
      border: 1px solid rgba(213, 197, 173, 0.75);
    }

    .detail-box b {
      display: block;
      color: var(--gold);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      letter-spacing: 0.14em;
      margin-bottom: 6px;
    }

    footer {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .dark {
      --bg: #161412;
      --paper: #201c18;
      --ink: #efe5d5;
      --muted: #b5a796;
      --line: #4b4036;
      --dark: #efe5d5;
      --accent: #d38b6d;
      --accent-soft: #6e493c;
      --gold: #d7ae67;
      background:
        radial-gradient(circle at top left, rgba(211, 139, 109, 0.16), transparent 34rem),
        linear-gradient(135deg, #151210 0%, #252019 100%);
    }

    .dark .site-header {
      background: rgba(22, 20, 18, 0.78);
      border-bottom-color: rgba(75, 64, 54, 0.9);
    }

    .dark .hero-card,
    .dark .faction-card,
    .dark .panel,
    .dark .detail-panel {
      background: rgba(32, 28, 24, 0.82);
      border-color: rgba(75, 64, 54, 0.95);
    }

    .dark .hero-summary,
    .dark .faction-card dd { color: #e6d8c6; }

    .dark .detail-box {
      background: rgba(22, 20, 18, 0.72);
      border-color: rgba(75, 64, 54, 0.95);
    }

    .dark .theme-toggle,
    .dark .btn.secondary { background: rgba(32, 28, 24, 0.74); }

    @media (max-width: 1040px) {
      .faction-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 680px) {
      .nav {
        align-items: flex-start;
        flex-direction: column;
        padding: 12px 0;
      }

      .nav-links {
        width: 100%;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .hero {
        min-height: auto;
        padding-top: 36px;
      }

      .hero-card { padding: 26px; }

      .faction-grid,
      .detail-grid { grid-template-columns: 1fr; }

      .faction-card { min-height: auto; }

      .section-title {
        align-items: start;
        flex-direction: column;
      }
    }
  
    .nav-links a,
    .theme-toggle,
    .btn {
      border-radius: 999px;
    }

    .tag,
    .keyword {
      border-radius: 999px;
    }

    .hero-card,
    .faction-card,
    .detail-panel,
    .panel {
      border-radius: 10px;
    }

    .detail-box {
      border-radius: 8px;
    }

  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="主导航">
      <a href="#top" class="brand">
        <span class="brand-mark" aria-hidden="true"><i class="fa-regular fa-compass"></i></span>
        <span>四方势力志</span>
      </a>
      <div class="nav-links">
        <a href="#overview">世界概览</a>
        <a href="#factions">四方势力</a>
        <a href="#resources">势力详志</a>
        <a href="characters.html">人物志</a>
        <button class="theme-toggle" type="button" id="themeToggle">夜色</button>
      </div>
    </nav>
  </header>

  <main id="top">
    <section class="hero" id="overview">
      <div class="hero-card">
        <p class="eyebrow">溪云初起日沉阁，山雨欲来风满楼</p>
        <h1>四方并立</h1>
        <p class="hero-summary">
          晏朝末年，天下名义上统归晏都。朝廷虽有旧帝与官僚维系正统，但王令难出都城，实权渐分四方：朔方掌兵马，淮郡保水乡百业，烛山诸部据群山而自成母系氏族的少数民族联盟。旧朝礼法、边镇军权、民间自治与山地部族秩序并立，乱世由此展开。
        </p>
        <div class="hero-actions">
          <a class="btn primary" href="#factions">四方势力</a>
          <a class="btn secondary" href="#resources">势力详志</a>
          <a class="btn secondary" href="characters.html">人物志</a>
        </div>
      </div>
    </section>

    <section id="factions">
      <div class="section-title">
        <div>
          <p class="eyebrow">FACTIONS</p>
          <h2>四方势力</h2>
        </div>
      </div>
      <div class="faction-grid" id="factionGrid"></div>
    </section>

    <section id="resources">
      <div class="section-title">
        <div>
          <p class="eyebrow">DETAILS</p>
          <h2>势力详志</h2>
        </div>
      </div>

      <div class="resource-panel">
<article class="detail-panel" id="detailPanel">
          <h3>晏都</h3>
          <p class="detail-meta">旧朝正统；旧帝与朝廷官僚所在</p>
          <div class="detail-grid" id="detailGrid"></div>
        </article>
      </div>
    </section>
  </main>

  <footer></footer>

  <script>
    const factions = [
      {
        name: "晏都",
        brief: "旧朝名义中心，正统尚存，实权已衰。",
        keywords: ["正统", "旧礼", "诏令"],
        seal: "https://f2.toyhou.se/file/f2-toyhou-se/images/120639159_33uqJf7PynvjDaI.png",
        symbol: "晏",
        resource: "名分",
        position: "旧朝正统；旧帝与朝廷官僚所在",
        politics: "皇帝与旧朝廷维持名义统治，宗庙、官署、礼制尚存。",
        strengths: "正统名分、旧礼、官僚体系、史官与诏令权威。",
        weakness: "实权衰微，王令难出都城，容易被各方借名行事。",
        culture: "宫廷、礼法、旧秩序、衰而未亡。",
        relation: "旧朝本体；仍是天下名义中心。",
        summary: "旧帝与朝廷仍在晏都维持正统，但天下已不再真正听命。"
      },
      {
        name: "朔方",
        brief: "北方边镇坐大，掌兵马军械，重军功法令。",
        keywords: ["兵马", "军府", "边镇"],
        seal: "https://f2.toyhou.se/file/f2-toyhou-se/images/120639165_95s2WugWb6SXhwP.png",
        symbol: "朔",
        resource: "兵马",
        position: "北方边镇；军政强权",
        politics: "由边军独大形成的军府/边镇政权，重军功、法令与粮草。",
        strengths: "兵马、马场、军械、屯田、边防经验。",
        weakness: "军令过严，民政承接不足；与地方旧俗、乡社秩序时有抵牾。",
        culture: "北境、铁骑、军府、冷硬、秩序。",
        relation: "名义隶属晏朝边镇体系，军府久掌一方，常以守边、靖乱之责行事。",
        summary: "朔方掌兵马，是最有能力打破格局的一方。"
      },
      {
        name: "淮郡",
        brief: "南方水乡自治之郡，以粮运、百业与民生自守。",
        keywords: ["水路", "粮仓", "百业"],
        seal: "https://f2.toyhou.se/file/f2-toyhou-se/images/120639158_99gpcW7sPeREut4.png",
        symbol: "淮",
        resource: "粮运与百业",
        position: "南方水乡共同体；百业自治之地",
        politics: "郡署、乡社、行会、书院、工坊共同维系地方秩序。",
        strengths: "水路、粮仓、漕运、工商业、民间协作、稳定日常。",
        weakness: "军力不足，水陆调度牵涉甚广；面对强权压境时，守成有余而进取不足。",
        culture: "水乡、舟楫、书院、市井、工坊、百业相安。",
        relation: "名义仍循旧朝郡县之制，实际以水乡粮运、乡社百业维持地方安定。",
        summary: "淮郡不求称霸，只想保住水路、粮仓和民生。"
      },
      {
        name: "烛山诸部",
        brief: "西境山地母系氏族联盟，掌铁、药、山道与古誓。",
        keywords: ["母族", "矿冶", "药术"],
        seal: "https://f2.toyhou.se/file/f2-toyhou-se/images/120639163_e9pvkpIbgauYox2.png",
        symbol: "烛",
        resource: "铁、药、山道",
        position: "西境少数民族，母系氏族联盟",
        politics: "多个山地部族组成联盟；母系氏族为根基，重大盟约需母族认可。",
        strengths: "矿冶、药术、山地机关、巫祝历法、山道与部族盟约。",
        weakness: "部族分散，难以统一行动；常被中原误解和排斥。",
        culture: "山寨、火塘、母族、巫祝、矿炉、草药、古老祭仪。",
        relation: "虽与旧朝有贸易往来，但偶尔也会发生冲突。",
        summary: "烛山不争中原正统，却以铁、药、山道和古誓影响天下。"
      }
    ];

    const factionGrid = document.querySelector("#factionGrid");
    const detailPanel = document.querySelector("#detailPanel");
    const detailGrid = document.querySelector("#detailGrid");
    const themeToggle = document.querySelector("#themeToggle");

    function createFactionCard(faction, index) {
      const card = document.createElement("article");
      card.className = "faction-card";
      card.dataset.faction = faction.name;
      card.style.setProperty("--seal-url", `url("${faction.seal}")`);
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", `查看${faction.name}详情`);

      card.innerHTML = `
        <h3 class="faction-name">${faction.name}</h3>
        <span class="tag">${faction.position}</span>
        <p class="faction-brief">${faction.brief}</p>
        <div class="faction-keywords">
          ${faction.keywords.map((keyword) => `<span class="keyword">${keyword}</span>`).join("")}
        </div>
        <span class="open-hint">查看详细设定 ↓</span>
      `;

      card.addEventListener("click", () => selectFaction(index));
      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectFaction(index);
        }
      });

      return card;
    }

    function selectFaction(index, shouldScroll = true) {
      const faction = factions[index];
      document.querySelectorAll(".faction-card").forEach((card, cardIndex) => {
        card.classList.toggle("active", cardIndex === index);
      });

      detailPanel.querySelector("h3").textContent = faction.name;
      detailPanel.querySelector(".detail-meta").textContent = faction.position;
      detailGrid.innerHTML = `
        <div class="detail-box">
          <b>政治形态</b>
          <p>${faction.politics}</p>
        </div>
        <div class="detail-box">
          <b>旧制关系</b>
          <p>${faction.relation}</p>
        </div>
        <div class="detail-box">
          <b>核心优势</b>
          <p>${faction.strengths}</p>
        </div>
        <div class="detail-box">
          <b>主要弱点</b>
          <p>${faction.weakness}</p>
        </div>
        <div class="detail-box">
          <b>社会 / 文化氛围</b>
          <p>${faction.culture}</p>
        </div>

      `;

      if (shouldScroll) {
        document.querySelector("#resources").scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    }


    function init() {
      factions.forEach((faction, index) => {
        factionGrid.appendChild(createFactionCard(faction, index));
      });
      selectFaction(0, false);
    }

    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      themeToggle.textContent = document.body.classList.contains("dark") ? "日色" : "夜色";
    });

    init();
  </script>
</body>
</html>
