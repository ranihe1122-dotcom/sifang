<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>四方地图</title>

<style>
  :root {
    --ink: #241f1b;
    --deep: #2e201d;
    --cinnabar: #883a1e;
    --green: #315444;
    --paper: #efe6d3;
    --line: rgba(36, 31, 27, 0.34);
    --muted: rgba(36, 31, 27, 0.68);
    --shadow: 0 18px 42px rgba(36,31,27,0.16);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    padding: 28px;
    background:
      radial-gradient(circle at 18% 12%, rgba(136,58,30,0.10), transparent 26rem),
      linear-gradient(135deg, #efe6d3 0%, #d9c8ad 100%);
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    color: var(--ink);
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(70, 52, 35, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 52, 35, 0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.72;
    z-index: -1;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .map-page {
    width: min(1120px, calc(100% - 24px));
    margin: 0 auto;
    padding: 20px 0 54px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .eyebrow {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--cinnabar);
    letter-spacing: 0.22em;
    font-size: 12px;
    font-weight: 700;
  }

  h1 {
    font-size: clamp(32px, 5vw, 54px);
    line-height: 1.1;
    letter-spacing: 0.16em;
    color: var(--deep);
    font-weight: 800;
  }

  h1::after {
    content: "";
    display: block;
    width: 72px;
    height: 2px;
    margin-top: 14px;
    background: linear-gradient(90deg, var(--cinnabar), transparent);
    opacity: 0.55;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .map-btn,
  .home-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 13px;
    border: 1px solid rgba(36,31,27,0.28);
    background: rgba(239,232,216,0.72);
    color: rgba(36,31,27,0.82);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: 0.18s ease;
  }

  .map-btn:hover,
  .home-link:hover {
    background: rgba(136,58,30,0.10);
    color: var(--cinnabar);
    transform: translateY(-1px);
  }

  .map-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    gap: 18px;
    align-items: start;
  }

  .map-shell {
    border: 1px solid rgba(36,31,27,0.34);
    background:
      linear-gradient(180deg, rgba(244,238,224,0.78), rgba(228,216,194,0.72));
    box-shadow: var(--shadow);
    padding: 14px;
    position: relative;
  }

  .map-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid rgba(36,31,27,0.34);
    background: rgba(239,232,216,0.62);
  }

  .map-stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background:
      linear-gradient(rgba(70, 52, 35, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 52, 35, 0.035) 1px, transparent 1px);
    background-size: 18px 18px;
    mix-blend-mode: multiply;
    opacity: 0.35;
  }

  .map-layer {
    position: absolute;
    inset: 0;
    transform-origin: center center;
    transition:
      transform 0.78s cubic-bezier(.2,.75,.2,1),
      opacity 0.28s ease,
      filter 0.28s ease;
  }

  .map-layer.fading {
    opacity: 0;
  }

  .map-layer.zooming {
    filter: blur(0.7px);
  }

  .map-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    user-select: none;
  }

  .points-layer {
    position: absolute;
    inset: 0;
    z-index: 6;
  }

  .map-point {
    position: absolute;
    left: calc(var(--x) * 1%);
    top: calc(var(--y) * 1%);
    transform: translate(-50%, -50%);
    z-index: 7;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: "Songti SC", "STSong", serif;
  }

  .map-point::before {
    content: "";
    display: block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid rgba(239,232,216,0.94);
    box-shadow: 0 0 0 5px rgba(49,84,68,0.16);
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease, border-radius 0.2s ease;
  }

  .map-point.enter::before {
    width: 19px;
    height: 19px;
    border-radius: 4px;
    background: #9d2418;
    border-color: rgba(255,244,224,0.96);
    box-shadow:
      0 0 0 5px rgba(157,36,24,0.18),
      0 0 24px rgba(157,36,24,0.36);
    transform: rotate(45deg);
  }

  .map-point:hover::before,
  .map-point:focus-visible::before,
  .map-point.selected::before {
    transform: scale(1.26);
    background: #3f6c58;
    box-shadow:
      0 0 0 6px rgba(49,84,68,0.22),
      0 0 28px rgba(49,84,68,0.34);
  }

  .map-point.enter:hover::before,
  .map-point.enter:focus-visible::before,
  .map-point.enter.selected::before {
    transform: rotate(45deg) scale(1.26);
    background: #b24a28;
    box-shadow:
      0 0 0 6px rgba(157,36,24,0.22),
      0 0 28px rgba(157,36,24,0.34);
  }

  .map-label {
    position: absolute;
    left: 50%;
    top: -36px;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 4px 9px;
    border: 1px solid rgba(36,31,27,0.28);
    background: rgba(239,232,216,0.92);
    color: #241f1b;
    font-size: 14px;
    letter-spacing: 0.12em;
    opacity: 1;
    pointer-events: none;
    transition: 0.2s ease;
    box-shadow: 0 4px 12px rgba(36,31,27,0.10);
  }

  .map-point:hover .map-label,
  .map-point:focus-visible .map-label,
  .map-point.selected .map-label {
    top: -40px;
    color: var(--cinnabar);
  }

  /* 第二层：淮郡、江亭、望津这类城市名 */
  .map-page.view-huai .map-label,
  .map-page.view-yan .map-label,
  .map-page.view-shuo .map-label,
  .map-page.view-zhushan .map-label {
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 2px 5px;
    top: -26px;
  }

  /* 第三层：淮王府、记室院这类城内地点 */
  .map-page.view-huaijun .map-label {
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 2px 5px;
    top: -26px;
  }

  .map-page.view-huai .map-point:hover .map-label,
  .map-page.view-huai .map-point:focus-visible .map-label,
  .map-page.view-huai .map-point.selected .map-label,
  .map-page.view-yan .map-point:hover .map-label,
  .map-page.view-yan .map-point:focus-visible .map-label,
  .map-page.view-yan .map-point.selected .map-label,
  .map-page.view-shuo .map-point:hover .map-label,
  .map-page.view-shuo .map-point:focus-visible .map-label,
  .map-page.view-shuo .map-point.selected .map-label,
  .map-page.view-zhushan .map-point:hover .map-label,
  .map-page.view-zhushan .map-point:focus-visible .map-label,
  .map-page.view-zhushan .map-point.selected .map-label,
  .map-page.view-huaijun .map-point:hover .map-label,
  .map-page.view-huaijun .map-point:focus-visible .map-label,
  .map-page.view-huaijun .map-point.selected .map-label {
    top: -29px;
  }

  .map-tip {
    margin-top: 12px;
    color: rgba(36,31,27,0.62);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.7;
  }

  .info-card {
    min-height: 280px;
    border: 1px solid rgba(36,31,27,0.30);
    background:
      linear-gradient(180deg, rgba(251,243,228,0.82), rgba(239,232,216,0.72));
    box-shadow: var(--shadow);
    padding: 20px;
    position: sticky;
    top: 24px;
  }

  .info-card .small {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--cinnabar);
    letter-spacing: 0.18em;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .info-card h2 {
    font-size: 28px;
    letter-spacing: 0.14em;
    color: var(--deep);
    margin-bottom: 12px;
  }

  .info-card p {
    font-size: 15px;
    line-height: 1.85;
    color: rgba(36,31,27,0.82);
    text-align: justify;
  }

  .info-card .path {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid rgba(36,31,27,0.18);
    color: rgba(36,31,27,0.56);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    line-height: 1.6;
  }

  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    color: rgba(36,31,27,0.62);
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend span::before {
    content: "";
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
    border: 2px solid rgba(239,232,216,0.94);
    box-shadow: 0 0 0 4px rgba(49,84,68,0.13);
  }

  .legend .enter-dot::before {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: #9d2418;
    box-shadow: 0 0 0 4px rgba(157,36,24,0.20);
    transform: rotate(45deg);
  }

  @media (max-width: 860px) {
    body {
      padding: 16px;
    }

    .topbar {
      align-items: flex-start;
      flex-direction: column;
    }

    .nav-actions {
      justify-content: flex-start;
    }

    .map-layout {
      grid-template-columns: 1fr;
    }

    .info-card {
      position: relative;
      top: auto;
      min-height: auto;
    }
  }

  @media (max-width: 680px) {
    .map-page {
      width: 100%;
      padding-top: 12px;
    }

    h1 {
      font-size: 30px;
    }

    .map-shell {
      padding: 10px;
    }

    .map-stage {
      aspect-ratio: 4 / 3;
    }

    .map-label {
      top: -30px;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 2px 6px;
    }

    .map-point:hover .map-label,
    .map-point:focus-visible .map-label,
    .map-point.selected .map-label {
      top: -33px;
    }

    .map-page.view-huai .map-label,
    .map-page.view-yan .map-label,
    .map-page.view-shuo .map-label,
    .map-page.view-zhushan .map-label,
    .map-page.view-huaijun .map-label {
      font-size: 8px;
      letter-spacing: 0.02em;
      padding: 1px 4px;
      top: -22px;
    }

    .map-page.view-huai .map-point:hover .map-label,
    .map-page.view-huai .map-point:focus-visible .map-label,
    .map-page.view-huai .map-point.selected .map-label,
    .map-page.view-yan .map-point:hover .map-label,
    .map-page.view-yan .map-point:focus-visible .map-label,
    .map-page.view-yan .map-point.selected .map-label,
    .map-page.view-shuo .map-point:hover .map-label,
    .map-page.view-shuo .map-point:focus-visible .map-label,
    .map-page.view-shuo .map-point.selected .map-label,
    .map-page.view-zhushan .map-point:hover .map-label,
    .map-page.view-zhushan .map-point:focus-visible .map-label,
    .map-page.view-zhushan .map-point.selected .map-label,
    .map-page.view-huaijun .map-point:hover .map-label,
    .map-page.view-huaijun .map-point:focus-visible .map-label,
    .map-page.view-huaijun .map-point.selected .map-label {
      top: -25px;
    }

    .map-point::before {
      width: 12px;
      height: 12px;
    }

    .map-point.enter::before {
      width: 16px;
      height: 16px;
    }

    .info-card h2 {
      font-size: 24px;
    }
  }
</style>
</head>

<body>
  <main class="map-page view-world" id="mapPage">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">MAP</p>
        <h1 id="mapTitle">四方地图</h1>
      </div>

      <nav class="nav-actions" aria-label="地图导航">
        <button class="map-btn" type="button" id="backBtn">返回上一级</button>
        <button class="map-btn" type="button" id="worldBtn">返回大地图</button>
        <a class="home-link" href="index.html">返回首页</a>
      </nav>
    </header>

    <section class="map-layout">
      <div>
        <div class="map-shell">
          <div class="map-stage" aria-label="互动地图">
            <div class="map-layer" id="mapLayer">
              <img
                class="map-img"
                id="mapImage"
                src="https://f2.toyhou.se/file/f2-toyhou-se/images/121283569_b7bp1ZOUUySr670.jpg"
                alt="四方地图"
              >
              <div class="points-layer" id="pointsLayer"></div>
            </div>
          </div>

          <p class="map-tip">
            电脑端：悬停显示简介，点击进入该区域地图
            <br>
            手机端：单击显示简介，双击进入该区域地图
          </p>

          <div class="legend">
            <span class="enter-dot">可进入下一层</span>
            <span>仅显示简介</span>
          </div>
        </div>
      </div>

      <aside class="info-card" id="mapInfo">
        <p class="small">LOCATION</p>
        <h2>四方地图</h2>
        <p>点击“淮、晏、朔、烛山”进入局部放大视图。淮中的“淮郡”可继续进入城内地图，其余城市先显示简介。</p>
        <div class="path">当前层级：四方地图</div>
      </aside>
    </section>
  </main>

<script>
  const WORLD_MAP = "https://f2.toyhou.se/file/f2-toyhou-se/images/121283569_b7bp1ZOUUySr670.jpg";

  const views = {
    world: {
      title: "四方地图",
      image: WORLD_MAP,
      transform: "scale(1) translate(0, 0)",
      back: null,
      path: "四方地图",
      points: [
        {
          name: "烛山",
          x: 19,
          y: 29,
          type: "enter",
          target: "zhushan",
          enterMode: "zoom",
          desc: "西境山地，诸部皆为母系氏族，掌矿冶炼金、药理与机关之术。"
        },
        {
          name: "朔",
          x: 75,
          y: 16,
          type: "enter",
          target: "shuo",
          enterMode: "zoom",
          desc: "北境之域，多设军府，马场、演武场与兵器库构成其根基。"
        },
        {
          name: "晏",
          x: 51,
          y: 45,
          type: "enter",
          target: "yan",
          enterMode: "zoom",
          desc: "旧朝正统所在，礼制与官署尚存，天子势弱，权势逐渐流散。"
        },
        {
          name: "淮",
          x: 47,
          y: 78,
          type: "enter",
          target: "huai",
          enterMode: "zoom",
          desc: "南方水乡，以水路为主干道，粮运便捷，百姓安居乐业。"
        }
      ]
    },

    huai: {
      title: "淮",
      image: WORLD_MAP,
      transform: "scale(2.35) translate(2%, -30%)",
      back: "world",
      path: "四方地图 / 淮",
      points: [
        {
          name: "淮郡",
          x: 47,
          y: 78,
          type: "enter",
          target: "huaijun",
          enterMode: "image",
          desc: "淮国都城，淮王府所在，淮国政治与水运中心。"
        },
        {
          name: "蘅浦",
          x: 40,
          y: 75,
          type: "info",
          desc: "水草丰美之地，风物清逸，不少书院建于此地。"
        },
        {
          name: "望津",
          x: 54,
          y: 76,
          type: "info",
          desc: "淮国要地，漕运商船往来不绝，粮道、盐务与书信流转之地。"
        },
        {
          name: "偃渚",
          x: 58,
          y: 83,
          type: "info",
          desc: "烟水迷离，洲泽之地，多为隐居者与水上人家所居之处。"
        },
        {
          name: "江亭",
          x: 36,
          y: 83,
          type: "info",
          desc: "临水小城，客栈与渡船相邻，常为远行、短暂停驻之地。"
        }
      ]
    },

    yan: {
      title: "晏",
      image: WORLD_MAP,
      transform: "scale(2.15) translate(-1%, 4%)",
      back: "world",
      path: "四方地图 / 晏",
      points: [
        {
          name: "晏都",
          x: 51,
          y: 45,
          type: "info",
          desc: "旧朝都城，皇宫所在之处，正统尚存但政令难行。"
        },
        {
          name: "承京",
          x: 45,
          y: 49,
          type: "info",
          desc: "都城外郭，前朝遗民与旁落士族聚居之处。"
        },
        {
          name: "奉陵",
          x: 56,
          y: 38,
          type: "info",
          desc: "晏朝历代帝王陵寝所在，显露旧朝余威。"
        },
        {
          name: "昭台",
          x: 58,
          y: 51,
          type: "info",
          desc: "钦天监观星之处，高子谏常来此处问星象之事，以吉凶之辞来定政令。"
        }
      ]
    },

    shuo: {
      title: "朔",
      image: WORLD_MAP,
      transform: "scale(2.25) translate(-28%, 28%)",
      back: "world",
      path: "四方地图 / 朔",
      points: [
        {
          name: "玄塞",
          x: 70,
          y: 13,
          type: "info",
          desc: "北境要塞，风雪严寒，兵马出入必经之处。"
        },
        {
          name: "白狼",
          x: 80,
          y: 20,
          type: "info",
          desc: "边地军城，马场与军寨相连，骑兵多于此处进行演练。"
        },
        {
          name: "朔方",
          x: 74,
          y: 25,
          type: "info",
          desc: "朔国都城，朔王府所在，朔国政治与军事中心。"
        },
        {
          name: "铁原",
          x: 66,
          y: 23,
          type: "info",
          desc: "铸铁屯田之地，供给军械、马具与粮草。"
        }
      ]
    },

    zhushan: {
      title: "烛山",
      image: WORLD_MAP,
      transform: "scale(2.35) translate(30%, 22%)",
      back: "world",
      path: "四方地图 / 烛山",
      points: [
        {
          name: "火塘寨",
          x: 19,
          y: 29,
          type: "info",
          desc: "烛山诸部议事之地，巫祝与各寨使者常在此处。"
        },
        {
          name: "青岚谷",
          x: 25,
          y: 21,
          type: "info",
          desc: "烛山药谷，药香常年不散，药术与巫祝传承之地。"
        },
        {
          name: "乌金峒",
          x: 14,
          y: 36,
          type: "info",
          desc: "矿冶炼金之地，炉火长明，铁器与机关材料多出此地。"
        },
        {
          name: "神誓坛",
          x: 28,
          y: 34,
          type: "info",
          desc: "族人盟誓之地，诸部联姻、颁布政令皆由此立。"
        }
      ]
    },

    huaijun: {
      title: "淮郡",
      image: "images/huaijun-map.jpg",
      transform: "scale(1) translate(0, 0)",
      back: "huai",
      path: "四方地图 / 淮 / 淮郡",
      points: [
        {
          name: "淮王府",
          x: 50,
          y: 36,
          type: "info",
          desc: "淮王齐临川居、执务之处，设正堂、议事厅与内书房。"
        },
        {
          name: "集市",
          x: 60,
          y: 68,
          type: "info",
          desc: "淮郡百业汇聚之处，舟商、工匠、药铺与行会往来不绝。"
        },
        {
          name: "演武场",
          x: 36,
          y: 54,
          type: "info",
          desc: "淮国练兵之地，齐斐、齐琅常来此处与军士一同操练。"
        },
        {
          name: "记室院",
          x: 44,
          y: 52,
          type: "info",
          desc: "姜玄居住、撰写文章之处，书卷气与酒香混在一处。"
        },
        {
          name: "长史院",
          x: 42,
          y: 44,
          type: "info",
          desc: "詹明居住、办公之处，靠近议事厅，烛火常燃不熄。"
        },
        {
          name: "司工署",
          x: 35,
          y: 66,
          type: "info",
          desc: "辛夷居住、研究工械、营造机关之处，图纸、木石与铁器堆满案头。"
        },
        {
          name: "缘会楼",
          x: 68,
          y: 72,
          type: "info",
          desc: "叶栖迟经营的茶楼，往来商客与闲人皆聚于此，也是各方势力传递情报之处。"
        }
      ]
    }
  };

  let currentView = "world";
  let historyStack = [];
  let selectedPointKey = null;
  const isTouchDevice = window.matchMedia("(hover: none)").matches;

  const mapPage = document.querySelector("#mapPage");
  const mapLayer = document.querySelector("#mapLayer");
  const mapImage = document.querySelector("#mapImage");
  const pointsLayer = document.querySelector("#pointsLayer");
  const mapTitle = document.querySelector("#mapTitle");
  const mapInfo = document.querySelector("#mapInfo");
  const backBtn = document.querySelector("#backBtn");
  const worldBtn = document.querySelector("#worldBtn");

  function setViewClass(viewName) {
    mapPage.classList.remove(
      "view-world",
      "view-huai",
      "view-yan",
      "view-shuo",
      "view-zhushan",
      "view-huaijun"
    );

    mapPage.classList.add(`view-${viewName}`);
  }

  function showInfo(point) {
    const modeText = point.type === "enter" ? "可进入下一层" : "地点简介";

    mapInfo.innerHTML = `
      <p class="small">${modeText}</p>
      <h2>${point.name}</h2>
      <p>${point.desc}</p>
      <div class="path">当前层级：${views[currentView].path}</div>
    `;
  }

  function showViewInfo(view) {
    mapInfo.innerHTML = `
      <p class="small">LOCATION</p>
      <h2>${view.title}</h2>
      <p>悬停或点击地点查看简介。</p>
      <div class="path">当前层级：${view.path}</div>
    `;
  }

  function clearSelectedPoint() {
    document.querySelectorAll(".map-point").forEach((point) => {
      point.classList.remove("selected");
    });
  }

  function renderPoints(view) {
    pointsLayer.innerHTML = "";

    view.points.forEach((point) => {
      const btn = document.createElement("button");
      btn.className = `map-point ${point.type}`;
      btn.type = "button";
      btn.style.setProperty("--x", point.x);
      btn.style.setProperty("--y", point.y);
      btn.setAttribute("aria-label", point.name);

      btn.innerHTML = `<span class="map-label">${point.name}</span>`;

      btn.addEventListener("mouseenter", () => {
        if (!isTouchDevice) {
          showInfo(point);
        }
      });

      btn.addEventListener("focus", () => showInfo(point));

      btn.addEventListener("click", () => {
        showInfo(point);

        const pointKey = `${currentView}-${point.name}`;

        clearSelectedPoint();
        btn.classList.add("selected");

        if (point.type !== "enter" || !point.target) {
          selectedPointKey = pointKey;
          return;
        }

        if (isTouchDevice) {
          if (selectedPointKey !== pointKey) {
            selectedPointKey = pointKey;
            return;
          }
        }

        selectedPointKey = pointKey;
        enterPoint(point);
      });

      pointsLayer.appendChild(btn);
    });
  }

  function enterPoint(point) {
    if (point.enterMode === "image") {
      switchImageView(point.target, true);
    } else {
      showZoomView(point.target, true);
    }
  }

  function showZoomView(viewName, pushHistory = true) {
    const view = views[viewName];
    if (!view) return;

    selectedPointKey = null;

    if (pushHistory && currentView !== viewName) {
      historyStack.push(currentView);
    }

    currentView = viewName;
    setViewClass(viewName);
    mapTitle.textContent = view.title;
    pointsLayer.innerHTML = "";

    if (mapImage.src !== view.image) {
      mapImage.src = view.image;
    }

    mapLayer.classList.add("zooming");
    mapLayer.style.transform = view.transform;

    setTimeout(() => {
      mapLayer.classList.remove("zooming");
      renderPoints(view);
      showViewInfo(view);
    }, 520);
  }

  function switchImageView(viewName, pushHistory = true) {
    const view = views[viewName];
    if (!view) return;

    selectedPointKey = null;

    if (pushHistory && currentView !== viewName) {
      historyStack.push(currentView);
    }

    currentView = viewName;
    setViewClass(viewName);
    mapTitle.textContent = view.title;
    pointsLayer.innerHTML = "";
    mapLayer.classList.add("fading");

    setTimeout(() => {
      mapImage.src = view.image;
      mapImage.alt = view.title;
      mapLayer.style.transform = view.transform;

      renderPoints(view);
      showViewInfo(view);

      requestAnimationFrame(() => {
        mapLayer.classList.remove("fading");
      });
    }, 280);
  }

  function loadView(viewName, pushHistory = true) {
    const view = views[viewName];
    if (!view) return;

    if (view.image === WORLD_MAP) {
      showZoomView(viewName, pushHistory);
    } else {
      switchImageView(viewName, pushHistory);
    }
  }

  function goBack() {
    selectedPointKey = null;
    const previous = historyStack.pop();

    if (!previous) {
      loadView("world", false);
      return;
    }

    loadView(previous, false);
  }

  function goWorld() {
    selectedPointKey = null;
    historyStack = [];
    currentView = "world";
    setViewClass("world");

    const view = views.world;

    mapTitle.textContent = view.title;
    pointsLayer.innerHTML = "";
    mapLayer.classList.add("fading");

    setTimeout(() => {
      mapImage.src = view.image;
      mapImage.alt = view.title;
      mapLayer.style.transform = view.transform;
      renderPoints(view);
      showViewInfo(view);

      requestAnimationFrame(() => {
        mapLayer.classList.remove("fading");
      });
    }, 220);
  }

  backBtn.addEventListener("click", goBack);
  worldBtn.addEventListener("click", goWorld);

  renderPoints(views.world);
  showViewInfo(views.world);
</script>
</body>
</html>
