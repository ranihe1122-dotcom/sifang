<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>杂谈</title>

<style>
  :root {
    --ink: #241f1b;
    --deep: #2e201d;
    --cinnabar: #883a1e;
    --gold: #9a743c;
    --green: #315444;
    --paper: #efe6d3;
    --paper-deep: #d9c8ad;
    --line: rgba(36,31,27,0.28);
    --muted: rgba(36,31,27,0.62);
    --shadow: 0 18px 42px rgba(36,31,27,0.14);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    padding: 28px;
    background:
      radial-gradient(circle at 18% 12%, rgba(136,58,30,0.10), transparent 26rem),
      radial-gradient(circle at 86% 22%, rgba(49,84,68,0.08), transparent 28rem),
      linear-gradient(135deg, var(--paper) 0%, var(--paper-deep) 100%);
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    color: var(--ink);
    line-height: 1.9;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(70, 52, 35, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 52, 35, 0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.72;
    z-index: -1;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button,
  input {
    font: inherit;
  }

  .page {
    width: min(1080px, calc(100% - 24px));
    margin: 0 auto;
    padding: 18px 0 56px;
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 24px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .eyebrow {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--cinnabar);
    letter-spacing: 0.24em;
    font-size: 12px;
    font-weight: 700;
  }

  h1 {
    font-size: clamp(36px, 5vw, 58px);
    line-height: 1.1;
    letter-spacing: 0.18em;
    color: var(--deep);
    font-weight: 800;
  }

  h1::after {
    content: "";
    display: block;
    width: 76px;
    height: 2px;
    margin-top: 14px;
    background: linear-gradient(90deg, var(--cinnabar), transparent);
    opacity: 0.55;
  }

  .page-caption {
    margin-top: 14px;
    max-width: 640px;
    color: rgba(36,31,27,0.62);
    font-size: 14px;
    line-height: 1.9;
    letter-spacing: 0.08em;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
    padding-top: 6px;
  }

  .nav-link,
  .plain-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 13px;
    border: 1px solid rgba(36,31,27,0.28);
    background: rgba(239,232,216,0.72);
    color: rgba(36,31,27,0.82);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: 0.18s ease;
  }

  .nav-link:hover,
  .plain-btn:hover {
    background: rgba(136,58,30,0.10);
    color: var(--cinnabar);
    transform: translateY(-1px);
  }

  .locked-screen {
    min-height: 68vh;
    display: grid;
    place-items: center;
  }

  .lock-card {
    width: min(520px, 100%);
    border: 1px solid rgba(36,31,27,0.32);
    background:
      linear-gradient(180deg, rgba(251,243,228,0.88), rgba(239,232,216,0.78));
    box-shadow: var(--shadow);
    padding: clamp(24px, 5vw, 42px);
    position: relative;
    overflow: hidden;
  }

  .lock-card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(70, 52, 35, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 52, 35, 0.03) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.58;
  }

  .lock-card > * {
    position: relative;
    z-index: 1;
  }

  .lock-title {
    margin-bottom: 8px;
    font-size: 30px;
    letter-spacing: 0.16em;
    color: var(--deep);
  }

  .lock-desc {
    margin-bottom: 22px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.85;
  }

  .password-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }

  .password-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid rgba(36,31,27,0.28);
    background: rgba(255,250,240,0.68);
    color: var(--ink);
    outline: none;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
  }

  .password-input:focus {
    border-color: rgba(136,58,30,0.48);
    box-shadow: 0 0 0 3px rgba(136,58,30,0.08);
  }

  .enter-btn {
    padding: 10px 15px;
    border: 1px solid var(--cinnabar);
    background: var(--cinnabar);
    color: var(--paper);
    cursor: pointer;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    transition: 0.18s ease;
  }

  .enter-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 20px rgba(36,31,27,0.12);
  }

  .error-msg {
    min-height: 24px;
    margin-top: 12px;
    color: var(--cinnabar);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
  }

  .content {
    display: none;
  }

  body.unlocked .locked-screen {
    display: none;
  }

  body.unlocked .content {
    display: block;
  }

  .filter-panel {
    margin-bottom: 22px;
    border: 1px solid rgba(36,31,27,0.32);
    background:
      linear-gradient(180deg, rgba(251,243,228,0.86), rgba(239,232,216,0.74));
    box-shadow: var(--shadow);
    padding: clamp(18px, 3vw, 26px);
  }

  .filter-header {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 16px;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(36,31,27,0.18);
    padding-bottom: 12px;
  }

  .filter-title {
    font-size: 22px;
    letter-spacing: 0.14em;
    color: var(--deep);
  }

  .filter-note {
    color: rgba(36,31,27,0.56);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
  }

  .filter-groups {
    display: grid;
    gap: 14px;
  }

  .filter-group {
    display: grid;
    grid-template-columns: 76px 1fr;
    gap: 12px;
    align-items: start;
  }

  .filter-label {
    padding-top: 4px;
    color: var(--gold);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
  }

  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .tag-btn {
    padding: 5px 10px;
    border: 1px solid rgba(36,31,27,0.22);
    background: rgba(255,250,240,0.52);
    color: rgba(36,31,27,0.72);
    cursor: pointer;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    transition: 0.16s ease;
  }

  .tag-btn:hover {
    border-color: rgba(136,58,30,0.32);
    background: rgba(136,58,30,0.08);
    color: var(--cinnabar);
  }

  .tag-btn.active {
    border-color: rgba(136,58,30,0.48);
    background: rgba(136,58,30,0.14);
    color: var(--cinnabar);
    font-weight: 700;
  }

  .works-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    color: rgba(36,31,27,0.62);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
  }

  .works-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .work-card {
    display: block;
    border: 1px solid rgba(36,31,27,0.30);
    background:
      linear-gradient(180deg, rgba(251,243,228,0.86), rgba(239,232,216,0.72));
    box-shadow: 0 10px 26px rgba(36,31,27,0.10);
    padding: 20px;
    transition: 0.18s ease;
  }

  .work-card:hover {
    transform: translateY(-2px);
    border-color: rgba(136,58,30,0.40);
    box-shadow: 0 16px 34px rgba(36,31,27,0.13);
  }

  .work-top {
    display: flex;
    justify-content: space-between;
    align-items: start;
    gap: 14px;
    margin-bottom: 12px;
  }

  .work-title {
    font-size: 24px;
    letter-spacing: 0.14em;
    color: var(--deep);
    line-height: 1.3;
  }

  .work-kind {
    flex: 0 0 auto;
    padding: 3px 8px;
    border: 1px solid rgba(154,116,60,0.24);
    background: rgba(154,116,60,0.08);
    color: var(--gold);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    font-weight: 700;
  }

  .work-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .work-tag {
    padding: 3px 8px;
    border: 1px solid rgba(36,31,27,0.16);
    background: rgba(255,250,240,0.48);
    color: rgba(36,31,27,0.60);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
  }

  .empty-state {
    display: none;
    border: 1px dashed rgba(36,31,27,0.30);
    background: rgba(255,250,240,0.42);
    padding: 24px;
    color: rgba(36,31,27,0.60);
    font-size: 14px;
    text-align: center;
  }

  .empty-state.show {
    display: block;
  }

  @media (max-width: 820px) {
    body {
      padding: 16px;
    }

    .page {
      width: 100%;
      padding-top: 12px;
    }

    .topbar {
      flex-direction: column;
      align-items: flex-start;
    }

    .nav-actions {
      justify-content: flex-start;
      padding-top: 0;
    }

    h1 {
      font-size: 34px;
    }

    .password-row {
      grid-template-columns: 1fr;
    }

    .filter-header {
      flex-direction: column;
      align-items: flex-start;
    }

    .filter-group {
      grid-template-columns: 1fr;
      gap: 6px;
    }

    .works-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>
  <section class="locked-screen" aria-label="杂谈密钥">
    <div class="lock-card">
      <p class="eyebrow">PRIVATE</p>
      <h1 class="lock-title">杂谈</h1>

      <div class="password-row">
        <input
          class="password-input"
          id="passwordInput"
          type="password"
          placeholder="请输入密钥"
          autocomplete="off"
        >
        <button class="enter-btn" type="button" id="unlockBtn">进入</button>
      </div>

      <p class="error-msg" id="errorMsg"></p>
    </div>
  </section>

  <main class="page content">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">FANWORKS</p>
        <h1>杂谈</h1>
      </div>

      <nav class="nav-actions" aria-label="页面导航">
        <a class="nav-link" href="../index.html">返回首页</a>
      </nav>
    </header>

    <section class="filter-panel">
      <div class="filter-header">
        <h2 class="filter-title">筛选</h2>
        <span class="filter-note">同一分类内可多选，不同分类之间同时生效</span>
      </div>

      <div class="filter-groups">
        <div class="filter-group">
          <div class="filter-label">角色</div>
          <div class="tag-row" id="characterFilters"></div>
        </div>

        <div class="filter-group">
          <div class="filter-label">CP</div>
          <div class="tag-row" id="cpFilters"></div>
        </div>

        <div class="filter-group">
          <div class="filter-label">图 / 文</div>
          <div class="tag-row" id="typeFilters"></div>
        </div>

        <div class="filter-group">
          <div class="filter-label">作者</div>
          <div class="tag-row" id="authorFilters"></div>
        </div>
      </div>
    </section>

    <div class="works-meta">
      <span id="countText">共 0 篇</span>
      <button class="plain-btn" type="button" id="clearFilters">清除筛选</button>
    </div>

    <section class="works-grid" id="worksGrid"></section>

    <div class="empty-state" id="emptyState">
      没有符合条件的作品。筛选器把作品筛没了，恭喜，它终于拥有了权力。
    </div>
  </main>

<script>
  const PASSWORD = "woyaokantongren!";

  const works = [
    {
      title: "不行",
      link: "buxing.html",
      characters: ["詹明", "辛夷","姜玄"],
      cps: ["詹明x辛夷"],
      types: ["文"],
      authors: ["珩光花信"]
    },
    {
      title: "80秀",
      link: "80xiu.html",
      characters: ["齐斐","齐琅","慎胤秀","冯瑛"],
      cps: ["all冯瑛"],
      types: ["文"],
      authors: ["苦茶子","珩光花信"]
    },
    {
      title: "画",
      link: "hua.html",
      characters: ["詹明","辛夷"],
      cps: ["詹明x辛夷"],
      types: ["文"],
      authors: ["珩光花信"]
    },
    {
      title: "解梦",
      link: "jiemeng.html",
      characters: ["辛夷","齐斐","齐琅","慎胤秀","冯瑛","叶栖迟","詹明","姜玄","郑麟书"],
      cps: ["无cp"],
      types: ["文"],
      authors: ["苦茶子","冰豆花"]
    },
    {
      title: "秋阳",
      link: "qiuyang.html",
      characters: ["辛夷","冯瑛","詹明","郑麟书"],
      cps: ["郑麟书x辛夷"],
      types: ["文"],
      authors: ["珩光花信"]
    },
    {
      title: "辛夷的一天",
      link: "xinyideyitian.html",
      characters: ["辛夷"],
      cps: ["all辛夷"],
      types: ["文"],
      authors: ["珩光花信"]
    },
    {
      title: "夕照何人",
      link: "xizhaoheren.html",
      characters: ["齐琅","冯瑛","詹明"],
      cps: ["齐琅x冯瑛"],
      types: ["文"],
      authors: ["珩光花信"]
    },
  ];

  const filterConfig = [
    {
      key: "characters",
      containerId: "characterFilters"
    },
    {
      key: "cps",
      containerId: "cpFilters"
    },
    {
      key: "types",
      containerId: "typeFilters"
    },
    {
      key: "authors",
      containerId: "authorFilters"
    }
  ];

  const activeFilters = {
    characters: new Set(),
    cps: new Set(),
    types: new Set(),
    authors: new Set()
  };

  const passwordInput = document.querySelector("#passwordInput");
  const unlockBtn = document.querySelector("#unlockBtn");
  const errorMsg = document.querySelector("#errorMsg");
  const worksGrid = document.querySelector("#worksGrid");
  const countText = document.querySelector("#countText");
  const emptyState = document.querySelector("#emptyState");
  const clearFilters = document.querySelector("#clearFilters");

  function unlockPage() {
    const value = passwordInput.value.trim();

    if (value === PASSWORD) {
      document.body.classList.add("unlocked");
      sessionStorage.setItem("zatanUnlocked", "true");
      errorMsg.textContent = "";
      return;
    }

    errorMsg.textContent = "密钥错误";
    passwordInput.select();
  }

  function getUniqueTags(key) {
    const tagSet = new Set();

    works.forEach((work) => {
      work[key].forEach((tag) => tagSet.add(tag));
    });

    return Array.from(tagSet);
  }

  function createFilterButton(key, tag) {
    const btn = document.createElement("button");
    btn.className = "tag-btn";
    btn.type = "button";
    btn.textContent = tag;

    btn.addEventListener("click", () => {
      if (activeFilters[key].has(tag)) {
        activeFilters[key].delete(tag);
        btn.classList.remove("active");
      } else {
        activeFilters[key].add(tag);
        btn.classList.add("active");
      }

      renderWorks();
    });

    return btn;
  }

  function renderFilters() {
    filterConfig.forEach((group) => {
      const container = document.querySelector(`#${group.containerId}`);
      const tags = getUniqueTags(group.key);

      container.innerHTML = "";

      tags.forEach((tag) => {
        container.appendChild(createFilterButton(group.key, tag));
      });
    });
  }

  function workMatchesFilters(work) {
    return filterConfig.every((group) => {
      const selectedTags = Array.from(activeFilters[group.key]);

      if (selectedTags.length === 0) {
        return true;
      }

      return selectedTags.some((tag) => work[group.key].includes(tag));
    });
  }

  function renderWorkCard(work) {
    const allTags = [
      ...work.characters.map((tag) => `角色：${tag}`),
      ...work.cps.map((tag) => `CP：${tag}`),
      ...work.types.map((tag) => tag),
      ...work.authors.map((tag) => `作者：${tag}`)
    ];

    const typeText = work.types.join(" / ");

    return `
      <a class="work-card" href="${work.link}">
        <div class="work-top">
          <h2 class="work-title">${work.title}</h2>
          <span class="work-kind">${typeText}</span>
        </div>
        <div class="work-tags">
          ${allTags.map((tag) => `<span class="work-tag">${tag}</span>`).join("")}
        </div>
      </a>
    `;
  }

  function renderWorks() {
    const filteredWorks = works.filter(workMatchesFilters);

    worksGrid.innerHTML = filteredWorks.map(renderWorkCard).join("");
    countText.textContent = `共 ${filteredWorks.length} 篇`;

    emptyState.classList.toggle("show", filteredWorks.length === 0);
  }

  function resetFilters() {
    Object.keys(activeFilters).forEach((key) => activeFilters[key].clear());

    document.querySelectorAll(".tag-btn").forEach((btn) => {
      btn.classList.remove("active");
    });

    renderWorks();
  }

  unlockBtn.addEventListener("click", unlockPage);

  passwordInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      unlockPage();
    }
  });

  clearFilters.addEventListener("click", resetFilters);

  renderFilters();
  renderWorks();

  if (sessionStorage.getItem("zatanUnlocked") === "true") {
    document.body.classList.add("unlocked");
  }
</script>
</body>
</html>
