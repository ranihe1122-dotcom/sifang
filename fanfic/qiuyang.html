固元十四年，秋。

辛夷的院子里又开始叮叮当当了。

她从炉子里夹出烧红的铁条，放在砧上，一锤一锤地砸。火星溅起来，落在皮围裙上，哧地灭了。她已经砸了半个时辰，额头上的汗顺着鬓角往下淌，她随手一抹，在脸上留下一道黑印。

“辛夷大人。”

院门口有人叫她。

辛夷没抬头，手里的锤子没停。她知道是谁——整个淮郡，只有一个人会用这种语气叫她。小心翼翼的，带着点紧张，像怕惊动什么似的。

“进来。”她说。

郑麟书推开院门，走进来。他今天没穿甲胄，换了一身靛蓝色的袍子，腰间系着一条黑色的革带，脚上蹬着一双薄底快靴。他走路的姿势很规矩，步子不大不小，背挺得笔直，像校场上走正步。

辛夷瞥了他一眼，又低下头继续砸。

“药在屋里桌上，绿的瓶外敷，白的瓶内服，自己拿。”

“末将不是来拿药的。”郑麟书站在她三步远的地方，手不知道放在哪里，最后背到了身后。

辛夷停下锤子，抬起头。

“那你来做什么？”

郑麟书的耳朵尖慢慢红了起来。他张了张嘴，又闭上，过了几息才说：“末将……路过。”

辛夷看了看院门。她的院子在世子府最西边，挨着马厩，再往西就是城墙了。这条巷子平时只有倒夜香的和送柴火的会经过。

“路过？”她重复了一遍。

“路过。”郑麟书说，语气比刚才坚定了些。

辛夷没有追问。她低下头，继续砸铁。

郑麟书站在那里，没有走。他站了一会儿，慢慢挪到炉子旁边，蹲下来，看着炉膛里的火。

“辛夷大人，”他说，“您一个人打铁，不闷吗？”

“不闷。”辛夷说，“打铁的时候脑子里不用想事，舒服。”

郑麟书“哦”了一声，不说话了。

炉火映着他的脸，红通通的。他的睫毛很长，垂着眼睛的时候，在眼下投了一小片扇形的阴影。

辛夷砸完这一块铁，把锤子扔进水桶里，嗤地冒起一股白烟。她摘下手套，在围裙上擦了擦手，走到桌边倒了一杯水，咕咚咕咚喝完了。

“小郑将军，”她转过身，靠在桌沿上，“你到底有什么事？”

郑麟书蹲在炉子边，仰着头看她。他今年十九岁，比辛夷小一岁，但长了一张看起来更小的脸。尤其是一脸无辜地蹲在地上的时候，像一个犯了错等着挨骂的弟弟。

“末将真的没事。”他说，“就是想来看看。”

“看什么？”

“看……看您打铁。”

辛夷盯着他看了两秒。

“无聊。”她说。

但她没有赶他走。

她转身走到炉子前，又夹出一块铁条，继续砸。

叮叮当当的声音重新响起来。郑麟书蹲在原来的位置，一动不动，像一只被安放在那里的摆件。

过了一会儿，猫来了。

猫是从墙头翻进来的。一只玳瑁色的土猫，瘦得能看见肋骨的轮廓，踩着无声的脚步走到炉子边，在郑麟书旁边蹲下来，舔了舔爪子。

郑麟书低下头，和猫对视了一眼。

“您养猫了？”他问。

“它自己来的。”辛夷头都没抬，“赖着不走。”

郑麟书伸出手，猫没有躲。他的手指轻轻挠了挠猫的下巴，猫眯起眼睛，发出呼噜呼噜的声音。

“它跟您亲。”郑麟书说。

“跟谁都亲。”辛夷说，“上回世子来，它还跳到世子腿上去了。”

郑麟书的手指顿了一下。

“世子也常来？”他问。

“偶尔。”辛夷说，“一般都是詹明来，或者冯瑛来。”

郑麟书“哦”了一声，继续摸猫。但他的动作比刚才慢了一些，像是在想什么事情。

猫被他摸得很舒服，翻了个身，露出毛茸茸的肚皮。郑麟书的嘴角微微弯了一下。

辛夷刚好抬头，看见了他那个笑容。

很轻，很淡，像秋天里最后一片叶子落在水面上。

她低下头，继续砸铁。

叮叮当当。

二

郑麟书第二次来，是三天后。

这次他带了一包东西。

“辛夷大人，”他站在院门口，手里举着一个油纸包，“校场旁边新开了一家铺子，卖肉干的。末将尝了尝，味道不错，给您带了一些。”

辛夷从炉子后面探出头，看了看那包肉干，又看了看他的脸。

“你专程来送肉干？”

“末将路过。”郑麟书说。

辛夷叹了口气。

“进来吧。”

郑麟书走进来，把油纸包放在桌上，然后在老位置——炉子边的地上——蹲了下来。猫比他还快，不知道从哪儿蹿出来，蹲在他旁边，仰着头看那包肉干。

“不是给你的。”郑麟书对猫说。

猫叫了一声。

辛夷洗了手，走过来，打开油纸包。肉干切得薄薄的，表面泛着油光，闻起来有一股香料的味道。她拿了一块放进嘴里，嚼了嚼。

“不错。”她说。

郑麟书的眼睛亮了一下。

“您喜欢就好。”

辛夷又拿了一块，边嚼边说：“小郑将军，你以后不用专程给我送东西。我又不是没饭吃。”

“末将知道。”郑麟书说，“末将就是……”

他停了一下，耳朵尖又红了。

“就是什么？”

“就是想谢谢您。”他说，“上次末将扭了手腕，您配的药膏很好用。”

辛夷看了他一眼。

“你扭手腕是三个月前的事了。”

郑麟书张了张嘴，没有说话。

辛夷没有再追问。她回到炉子前，继续打铁。

郑麟书蹲在炉子边，继续摸猫。

两个人都没有说话，但谁也不觉得尴尬。

傍晚的时候，冯瑛来了。

她手里提着一个食盒，进门就看见郑麟书蹲在地上摸猫，脚步顿了一下。

“小郑将军也在？”

郑麟书站起来，朝冯瑛行了个礼：“末将见过夫人。”

冯瑛点了点头，目光在郑麟书和辛夷之间来回转了一圈，嘴角微微弯了一下。

“我带了缘会楼的龙井茶酥。”她把食盒放在桌上，打开，拿出一碟青绿色的点心，“趁热吃。”

辛夷立刻扔下锤子，洗了手，坐过来。

“令仪，你真是救苦救难。”

“少拍马屁。”冯瑛笑着坐下，又看了一眼郑麟书，“小郑将军也来尝尝？”

“末将……”郑麟书看了看辛夷，辛夷已经拿了一块咬了一大口，酥皮掉了一身。他犹豫了一下，也拿了一块，小口小口地吃着。

冯瑛端着茶碗，目光在两个人之间转了一圈。

“小郑将军今日休沐？”她问。

“是。”郑麟书说，“末将轮休。”

“难怪有空来辛夷这里坐坐。”

郑麟书的耳朵又红了。

“末将路过。”他说。

冯瑛端起茶碗喝了一口，遮住了嘴角的笑意。

辛夷咬着茶酥，含混地说：“他上次也说是路过。”

“那这次呢？”冯瑛问。

辛夷看了郑麟书一眼。

郑麟书低着头，耳朵红得像要滴血，手里那块茶酥已经被他捏得变形了。

“大概还是路过。”辛夷说。

冯瑛笑了。

“那倒是巧，”她说，“每次都路过同一个地方。”

郑麟书恨不得找条地缝钻进去。

辛夷没有注意到他的窘迫。她已经吃完第二块，伸手去拿第三块了。

三

郑麟书和冯瑛真正熟络起来，是在固元十四年的冬天。

起因还是猫。

猫病了。不知道吃坏了什么东西，趴在炉子边一动不动，连叫都不叫了。辛夷虽然嘴上说“它自己来的，死了也不关我事”，但还是蹲在猫旁边，皱着眉头看了半天。

“令仪，”她让人带话给冯瑛，“你认识的人多，知不知道谁会看猫？”

冯瑛来了之后，看了猫一眼，说：“我带它去找个大夫。”

“兽医？”辛夷问。

“人医。”冯瑛说，“朔国有个老大夫，专门给人看病的，但也会看猫。以前我大哥养的那只狗，就是他治好的。”

辛夷犹豫了一下，点了点头。

冯瑛抱起猫，猫软绵绵地趴在她怀里，没有挣扎。

“我送去，明天给你送回来。”

“麻烦你了。”辛夷说。

冯瑛摇了摇头，抱着猫走了。慎胤秀跟在后面，面无表情。

第二天，冯瑛把猫送回来的时候，郑麟书也在。

他不是故意的。他是真的来拿药——他昨天在校场上擦伤了手掌，皮掉了一大块，疼得龇牙咧嘴。校场的军医给他包扎了，但他觉得还是辛夷配的药膏好，就绕路过来了。

他一进门，就看见冯瑛坐在石凳上，怀里抱着一只用旧棉袄裹着的猫。

“夫人？”他愣了一下。

“小郑将军。”冯瑛朝他点了点头，“手怎么了？”

“擦伤了。”郑麟书举起包着纱布的手，“来换药。”

辛夷从屋里出来，手里拿着两个青瓷瓶，看见郑麟书，把瓶子递给他：“绿的昨天换过了，今天用白的。一天一次。”

“多谢辛夷大人。”

郑麟书接过瓶子，没有走。他在炉子边蹲下来，看了一眼冯瑛怀里的猫。

“它怎么了？”

“吃坏肚子了。”冯瑛说，“大夫说没什么大事，就是饿两顿。”

猫在冯瑛怀里翻了个身，露出肚皮。郑麟书伸出手，轻轻挠了挠。

猫呼噜呼噜地叫起来。

冯瑛看着郑麟书摸猫的样子，忽然说了一句：“小郑将军，你好像很喜欢猫。”

“末将小时候养过。”郑麟书说，“后来老死了。”

“那你现在可以再养一只。”

郑麟书看了一眼辛夷的院子。辛夷已经回到炉子前继续打铁了，叮叮当当的声音盖住了他们的对话。

“末将……没有时间。”他说，“校场事多。”

冯瑛看了他一眼，没有说什么。

过了一会儿，辛夷停下来喝水，郑麟书站起来，朝她抱了抱拳：“辛夷大人，末将先走了。”

“嗯。”辛夷点了点头，“手记得换药。”

“末将记住了。”

郑麟书走了。

冯瑛坐在石凳上，看着他的背影消失在院门外，忽然开口：“桑若。”

“嗯？”

“小郑将军多大了？”

辛夷想了想：“好像十九？比我小一岁。”

“那也不小了。”冯瑛说，“该成家了。”

辛夷端着水杯，愣了一下。

“你操什么心。”她说，“人家是将门之子，还用你操心婚事？”

冯瑛笑了笑，没有反驳。

她把猫放在炉子边，站起来理了理裙子。

“我走了。猫要是还不好，跟我说。”

“好。”

冯瑛走到院门口，停下来，回头看了一眼。

辛夷已经又拿起锤子了。

冯瑛轻轻叹了口气，走了。

四

之后的日子里，郑麟书和冯瑛的交集多了起来。

不在辛夷的院子里——而是在别处。

有一天，冯瑛去缘会楼买点心，出来的时候在门口遇见了郑麟书。他站在路边，手里拿着一包东西，脸上带着一种说不清的表情——像是在等什么人，又像是在犹豫要不要进去。

“小郑将军？”冯瑛叫了他一声。

郑麟书回过头，连忙行礼：“夫人。”

“来买点心？”

“末将……”他看了看手里的油纸包，耳朵又红了，“末将路过。”

冯瑛笑了。

“你每次都说路过。”

郑麟书低下头，没有说话。

冯瑛看着他，忽然问：“又是给辛夷买的？”

郑麟书的手指攥紧了油纸包。

“末将……上次她说肉干好吃，末将就多买了一些。”

冯瑛点了点头。她看了看四周，街上人不多，慎胤秀站在不远处，警惕地观察着来往的行人。

“小郑将军，”她说，“你如果没什么急事，陪我说几句话？”

郑麟书愣了一下，然后点了点头。

两个人沿着街边走了一段，在一棵槐树下的石凳上坐下了。慎胤秀站在不远处，像一根不会动的柱子。

“小郑将军，”冯瑛开口，“你是不是喜欢辛夷？”

郑麟书的脸“腾”地红了。

“末将……”他张了张嘴，一个字都说不出来。

冯瑛没有催他。她安静地等着，看着街上来来往往的行人。

过了很久，郑麟书终于开口了。

“末将……末将不知道。”他的声音很低，低到像是说给自己听的，“末将每次见到辛夷大人，心跳就会变得很快。末将想见她，又怕见她。见了她，不知道该说什么；不见她，又总想着她在做什么。”

他停了一下。

“末将从来没有过这种感觉。”

冯瑛安静地听着。

“末将知道，末将不该有这种心思。”郑麟书的声音有些发紧，“辛夷大人是司工参军，末将只是一个还没领兵的偏将。她比末将大，又是詹明先生的学生……”

“她只比你大一岁。”冯瑛说。

郑麟书抬起头，看着她。

“大一岁而已。”冯瑛说，“不是问题。”

郑麟书低下头，看着自己手里的油纸包。那包肉干已经被他攥得皱巴巴的了。

“末将不知道她怎么想的。”他说，“她每次看见末将，都像看一个孩子。她说末将比她小，应该照顾末将。”

“你觉得呢？”冯瑛问。

“末将觉得……”郑麟书咬了咬嘴唇，“末将觉得一岁不算什么。末将不是孩子。”

冯瑛看着他认真的样子，忍不住弯了一下嘴角。

“那你有没有想过，也许她只是用‘你小’当借口？她不好意思亲近你，就说要‘照顾’你。”

郑麟书愣了一下。

“她……她为什么要不好意思？”

冯瑛看着他，觉得这孩子是真的什么都不懂。

“你去问她。”冯瑛站起来，“我帮不了你。”

“夫人——”郑麟书也站起来，有些着急，“末将不敢。”

“不敢什么？”

“不敢问。”郑麟书低下头，“末将怕问了之后，连现在这样都不如了。”

冯瑛看着他，沉默了一会儿。

“小郑将军，”她说，“如果你一直不问，那你永远都不知道答案。”

郑麟书没有说话。

冯瑛没有再说什么，带着慎胤秀走了。

郑麟书站在槐树下，站了很久。

手里的肉干已经凉了。

五

又过了几天，冯瑛在世子府的回廊上遇到了郑麟书。

他刚从校场出来，甲胄还没脱，满头是汗。看见冯瑛，他停下来行了个礼。

“夫人。”

“小郑将军。”冯瑛看了一眼他身上的甲胄，“刚下值？”

“是。”郑麟书说，“末将……末将想去找辛夷大人换药。”

“你的手还没好？”

郑麟书举起右手。纱布已经不在了，手掌上新生的皮肤粉红粉红的，看起来好得差不多了。

“快好了。”他说，“再换一次药就行。”

冯瑛看着他。

“你是去换药，还是去看她？”

郑麟书的耳朵又红了。

“末将……换药。”

冯瑛叹了口气。

“小郑将军，你这人，什么都写在脸上。”

郑麟书下意识地摸了摸自己的脸。

冯瑛看他那个样子，忍不住笑了。

“走吧，”她说，“我正好也要去找辛夷，一起。”

两个人一前一后地走到辛夷的院子。还没进门，就听见里面叮叮当当的打铁声。

郑麟书站在门口，深吸了一口气，然后推门进去。

辛夷正背对着门口在砸铁。她今天穿了一件灰色的短褐，头发用一根木簪随便绾着，后颈露出一截被炉火烤得发红的皮肤。

“辛夷大人。”郑麟书叫了一声。

辛夷没听见。

“辛夷大人！”他提高了声音。

辛夷的锤子顿了一下，然后她回过头。

“哦，小郑将军。”她放下锤子，摘下手套，“来换药？”

“是。”

辛夷走进屋里，拿了两个青瓷瓶出来。她把瓶子递给郑麟书，顺手翻了翻他的手掌。

“好得差不多了，再涂两天就不用涂了。”

“多谢辛夷大人。”

辛夷点了点头，转身又要去打铁。

“辛夷大人，”郑麟书叫住她，“末将……末将给您带了肉干。”

他从袖子里掏出那包被攥得皱巴巴的油纸包，放在桌上。

辛夷看了一眼，又看了他一眼。

“你不是前几天刚送过？”

“上次的应该吃完了。”郑麟书说。

辛夷盯着他看了两秒。

“你怎么知道吃完了？”

郑麟书张了张嘴，没有说话。

冯瑛站在旁边，端着茶碗，低头喝茶，假装什么都没听见。

“行了。”辛夷拿起那包肉干，拆开，拿了一块塞进嘴里，“谢谢。手记得换药。”

“末将记住了。”

郑麟书没有走。他蹲到炉子边，猫不知道从哪里冒出来，跳到他膝盖上，缩成一团。

辛夷看着那一人一猫，摇了摇头，继续打铁。

冯瑛在旁边看着这一幕，忍不住轻轻笑了一声。

六

固元十五年春，烛山防务的事越来越紧。

辛夷几乎每天都要去政事堂。她的守城器械设计已经改了七版，兵部和工部的人意见不一，吵来吵去，她一个人要应付两边，嗓门都比从前大了。

郑麟书也开始频繁出入政事堂。他父亲郑昌延让他跟着旁听军务，学学怎么跟文官打交道。他每次都坐在角落里，不怎么说话，但辛夷开口的时候，他会不自觉地坐直身体。

有一天，兵部侍郎又跟辛夷吵起来了。

“辛夷大人，您这个设计是好，但成本太高了。淮国没那么多银子。”

“成本高是因为铁料贵。”辛夷说，“你们兵部不是跟北边的铁矿有协议吗？去谈，把价格压下来。”

“那是工部的事。”

“工部谈不下来，你们兵部去谈。弩车是你们用，不是工部用。”

兵部侍郎被噎了一下，正要反驳，角落里传来一个声音。

“末将觉得辛夷大人说得有道理。”

所有人看向郑麟书。

郑麟书坐在椅子上，腰背挺得笔直，脸不红心不跳。

“末将不懂军械，但末将知道，战场上射程多几步，少死很多人。这笔银子不该省。”

兵部侍郎张了张嘴，看了一眼郑麟书——郑昌延的儿子，得罪不起——又把嘴闭上了。

“那就……再议吧。”他说。

辛夷看了郑麟书一眼。

郑麟书正低头翻军报，假装什么都没发生。

但辛夷注意到，他的耳朵尖是红的。

议事结束后，辛夷收拾图纸，郑麟书还坐在角落里。

“小郑将军，”辛夷说，“你刚才为什么要替我说话？”

郑麟书抬起头，耳朵更红了。

“末将……末将说的是事实。”

“事实是兵部侍郎觉得我在烧钱。”辛夷把图纸卷好，夹在腋下，“你帮了我，他以后更看我不顺眼。”

“他不敢。”郑麟书说。

“为什么？”

“他怕我爹。”

辛夷愣了一下，然后笑了。

那笑声很轻，但郑麟书听见了。他抬起头，看见辛夷嘴角弯着，眼睛里有光。

他的心跳一下子快了。

“走吧，”辛夷说，“请你吃肉干。”

“末将……”

“别又说是路过。”辛夷打断他，“跟我走。”

郑麟书站起来，跟在她身后，走出了政事堂。

七

郑麟书和冯瑛第三次“偶遇”，是在固元十五年的夏天。

冯瑛在花园里修剪花枝，郑麟书从校场回来，路过花园门口，犹豫了一下，还是走进去了。

“夫人。”他行了个礼。

冯瑛放下剪刀，看着他。

“小郑将军，你看起来有心事。”

郑麟书低下头，没有说话。

冯瑛在石凳上坐下，指了指对面的位置。

“坐。”

郑麟书坐下，双手放在膝盖上，像一个等着被先生训话的学生。

“说吧。”冯瑛说。

“末将……”郑麟书的声音很低，“末将最近总是睡不着。”

“为什么？”

“末将总是在想……”他咬了咬嘴唇，“想辛夷大人。”

冯瑛安静地听着。

“末将每次见到她，都想跟她说很多话。可是见了她，什么都说不出来。”郑麟书抬起头，看着冯瑛，“夫人，末将是不是很没用？”

“不是。”冯瑛说，“你只是太紧张了。”

“末将该怎么办？”

冯瑛想了想。

“你跟她多待一会儿。别总想着‘要说什么’，就待着。让她习惯你在身边。”

郑麟书认真地听着，点了点头。

“末将试试。”

“还有，”冯瑛说，“别每次都说‘路过’。你说了她也不信。”

郑麟书又点了点头。

但他后来还是说“路过”。

改不了。

八

齐临川是在政事堂旁边的暖阁里发现这件事的。

他那天去政事堂转了一圈，想听听烛山防务的进展。走到门口的时候，没有进去，站在窗外听了一会儿。

他听见辛夷在和兵部的人争论弩车的射程，也听见角落里一个年轻的声音替她说话。

他探头看了一眼。

郑昌延的儿子，郑麟书。

齐临川没有进去，转身回了暖阁。

过了几日，他把詹明叫来了。

“文载，坐。”

詹明在书案对面的椅子上坐下。齐临川给他倒了一杯茶，他接过去，放在手边，没有喝。

“政事堂那边，”齐临川开口，“你最近去了没有？”

“去了几次。”詹明说。

“小郑将军呢？”

詹明的手指微微动了一下。

“也去了。”他说。

齐临川点了点头。

“我观察了一阵子，”他说，“这孩子看辛夷的眼神不对。”

詹明没有说话。

“你说，他是不是对辛夷有意思？”

“臣不确定。”詹明说。

齐临川笑了一下。

“文载，你跟我绕弯子。”

詹明垂下眼睛，端起茶碗，喝了一口。

“臣以为，”他放下茶碗，“就算他有这个意思，也未必合适。”

“不合适在何处？”

“辛夷的性子，主公知道。她不受拘束，不喜被人安排。”

齐临川沉默了片刻。

“你是说，她不愿意？”

“臣不知道。”詹明说，“但臣觉得，这件事不该由臣等替她决定。”

齐临川的手指在扶手上轻轻敲了两下。

“那依你之见？”

“顺其自然。”詹明说，“若他们有缘分，不必臣等操心。若无缘分，赐婚反倒成了怨偶。”

齐临川看着他，看了很久。

“文载，你这个人，什么都替别人想好了，就是不替自己想。”

詹明没有接话。

“好。”齐临川端起茶碗，喝了一口，“听你的。”

詹明站起来，行了一礼。

“臣告退。”

他转身走了出去。

齐临川一个人坐在暖阁里，茶已经凉了。他端起茶杯，喝了一口。

凉茶有一股涩味，不太好喝。

他放下茶杯，轻轻叹了口气。

这件事，从此没有再提过。

而辛夷什么都不知道。

九

辛夷最近觉得郑麟书有些奇怪。

他来的次数越来越多了。有时候是来拿药，有时候是来送肉干，有时候什么都不带，就蹲在炉子边摸猫。猫被他摸得越来越胖，也越来越懒，整天趴在炉子边睡觉，连老鼠都不抓了。

“小郑将军，”辛夷有一天终于忍不住了，“你不用每天来。”

郑麟书抬起头，耳朵又红了。

“末将……末将喜欢这里。”他说。

辛夷愣了一下。

“喜欢这里？”她看了看自己的院子。炉子、铁砧、一堆废铁、一只胖猫、满地的铁屑。这地方有什么好喜欢的？

“这里暖和。”郑麟书说。

辛夷看了一眼炉膛里的火。

“你冷？”

“末将……怕冷。”

辛夷想了想，走进屋里，翻出一件旧棉袄，扔给他。

“穿上。”

郑麟书抱着那件棉袄，愣住了。

棉袄是辛夷的，洗得发白，袖口磨出了毛边，但很干净。上面有一股铁锈和皂角混在一起的味道。

“这……”

“你不是怕冷吗？”辛夷已经回到炉子前了，“穿着。”

郑麟书把那件棉袄慢慢展开，披在身上。棉袄有点小，袖子短了一截，但他觉得浑身都暖了。

猫从他脚边跳到他膝盖上，找了个舒服的姿势，继续睡。

郑麟书坐在炉子边，穿着辛夷的旧棉袄，怀里抱着一只胖猫，耳朵红红的，嘴角弯着。

辛夷偶尔抬头看他一眼，心想：这孩子，怎么像个傻子似的。

但她没有说出来。

她低下头，继续打铁。

叮叮当当。

十

固元十五年秋，齐临川再没有提过赐婚的事。

詹明也没有再提起过。

辛夷不知道这一切。她只知道齿轮的咬合角度终于对了，弹簧的配方也定了下来，弩车的射程能多覆盖两百步。

她把第四个模型拆了装、装了拆，最后拉动绳索，小木箭射出去，钉在对面墙上挂着的靶子上，正中红心。

猫被吓了一跳，从炉子边跳起来，钻到桌子底下去了。

郑麟书正好推门进来，看见那支还在微微颤抖的小木箭。

“辛夷大人，成了？”他问。

辛夷转过头，看着他。

郑麟书穿着一件半旧的墨绿色袍子，手里提着一包肉干。猫从桌底下探出头，看见是他，又钻了出来，跑到他脚边蹭了蹭。

辛夷忽然笑了一下。

“成了。”她说。

郑麟书看着她脸上的笑容，心跳又快了。

他把肉干放在桌上，蹲下来摸了摸猫。

“末将恭喜辛夷大人。”

“有什么好恭喜的，”辛夷把模型收起来，“这东西上了战场才知道好不好用。”

“末将觉得好用。”郑麟书说。

“你又没用过。”

“末将看过您的图纸。末将虽然不懂齿轮，但末将觉得，您做的东西，不会差。”

辛夷看了他一眼，没有说话。

过了一会儿，她走到桌边，拆开那包肉干，拿了一块放进嘴里。

“这家的肉干比上次那家好吃。”她说。

“末将也觉得。”郑麟书的眼睛亮了一下，“末将下次还买这家。”

“不用天天买。”辛夷说，“我又不是猪。”

郑麟书低下头，耳朵又红了。

猫在他脚边打了个滚，露出肚皮。

辛夷看着那一人一猫，忽然觉得这个秋天好像也没那么冷。

她端起水杯，喝了一口。

水是凉的，但喉咙里是暖的。

院子里，炉火还烧着。

铁条还红着。

猫还睡着。

日子还长。
