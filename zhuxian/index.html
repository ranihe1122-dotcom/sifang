<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>四方纪闻</title>

<style>
  :root {
    --ink: #241f1b;
    --deep: #2e201d;
    --cinnabar: #883a1e;
    --gold: #9a743c;
    --paper: #efe6d3;
    --paper-deep: #d9c8ad;
    --line: rgba(36,31,27,0.28);
    --muted: rgba(36,31,27,0.62);
    --shadow: 0 18px 42px rgba(36,31,27,0.14);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    min-height: 100vh;
    padding: 28px;
    background:
      radial-gradient(circle at 18% 12%, rgba(136,58,30,0.10), transparent 26rem),
      radial-gradient(circle at 86% 22%, rgba(49,84,68,0.08), transparent 28rem),
      linear-gradient(135deg, var(--paper) 0%, var(--paper-deep) 100%);
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    color: var(--ink);
    line-height: 1.9;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(70, 52, 35, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 52, 35, 0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.72;
    z-index: -1;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  .page {
    width: min(980px, calc(100% - 24px));
    margin: 0 auto;
    padding: 18px 0 56px;
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 24px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .eyebrow {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--cinnabar);
    letter-spacing: 0.24em;
    font-size: 12px;
    font-weight: 700;
  }

  h1 {
    font-size: clamp(36px, 5vw, 58px);
    line-height: 1.1;
    letter-spacing: 0.18em;
    color: var(--deep);
    font-weight: 800;
  }

  h1::after {
    content: "";
    display: block;
    width: 76px;
    height: 2px;
    margin-top: 14px;
    background: linear-gradient(90deg, var(--cinnabar), transparent);
    opacity: 0.55;
  }

  .page-caption {
    margin-top: 14px;
    max-width: 620px;
    color: rgba(36,31,27,0.62);
    font-size: 14px;
    line-height: 1.9;
    letter-spacing: 0.08em;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
    padding-top: 6px;
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 13px;
    border: 1px solid rgba(36,31,27,0.28);
    background: rgba(239,232,216,0.72);
    color: rgba(36,31,27,0.82);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: 0.18s ease;
  }

  .nav-link:hover {
    background: rgba(136,58,30,0.10);
    color: var(--cinnabar);
    transform: translateY(-1px);
  }

  .catalog-shell {
    border: 1px solid rgba(36,31,27,0.32);
    background:
      linear-gradient(180deg, rgba(251,243,228,0.88), rgba(239,232,216,0.76));
    box-shadow: var(--shadow);
    padding: clamp(22px, 4vw, 34px);
    position: relative;
    overflow: hidden;
  }

  .catalog-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(70, 52, 35, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(70, 52, 35, 0.03) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: 0.58;
  }

  .catalog-shell > * {
    position: relative;
    z-index: 1;
  }

  .section-title {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(36,31,27,0.22);
  }

  .section-title h2 {
    font-size: 24px;
    letter-spacing: 0.16em;
    color: var(--deep);
  }

  .section-title span {
    font-family: "Times New Roman", serif;
    color: rgba(36,31,27,0.55);
    font-size: 13px;
    letter-spacing: 0.22em;
  }

  .catalog-list {
    display: grid;
    gap: 14px;
  }

  .work-card {
    display: grid;
    grid-template-columns: 120px minmax(0, 1fr) auto;
    gap: 18px;
    align-items: center;
    padding: 18px 18px;
    border: 1px solid rgba(36,31,27,0.22);
    background: rgba(255,250,240,0.50);
    transition: 0.18s ease;
  }

  .work-card:hover {
    transform: translateY(-2px);
    border-color: rgba(136,58,30,0.36);
    background: rgba(136,58,30,0.08);
    box-shadow: 0 12px 24px rgba(36,31,27,0.10);
  }

  .work-year {
    color: var(--gold);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.12em;
  }

  .work-title {
    margin-bottom: 4px;
    font-size: 24px;
    letter-spacing: 0.16em;
    color: var(--deep);
    font-weight: 700;
  }

  .work-meta {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    color: rgba(36,31,27,0.60);
    letter-spacing: 0.08em;
  }

  .read-link {
    justify-self: end;
    padding: 7px 12px;
    border: 1px solid rgba(136,58,30,0.30);
    color: var(--cinnabar);
    background: rgba(255,250,240,0.48);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
  }

  .footer-note {
    margin-top: 22px;
    color: rgba(36,31,27,0.56);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px;
    line-height: 1.7;
  }

  @media (max-width: 760px) {
    body {
      padding: 16px;
    }

    .page {
      width: 100%;
      padding-top: 12px;
    }

    .topbar {
      flex-direction: column;
      align-items: flex-start;
    }

    .nav-actions {
      justify-content: flex-start;
      padding-top: 0;
    }

    h1 {
      font-size: 34px;
    }

    .work-card {
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: start;
    }

    .read-link {
      justify-self: start;
      margin-top: 6px;
    }

    .section-title {
      align-items: start;
      flex-direction: column;
      gap: 6px;
    }
  }
</style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">CHRONICLES</p>
        <h1>四方纪闻</h1>
      </div>

      <nav class="nav-actions" aria-label="页面导航">
        <a class="nav-link" href="index.html">返回首页</a>
      </nav>
    </header>

    <section class="catalog-shell">
      <div class="section-title">
        <h2>目录</h2>
        <span>CATALOGUE</span>
      </div>

      <div class="catalog-list">
        <a class="work-card" href="shuofengxianghuai.html">
          <span class="work-year">固元十二年</span>
          <span>
            <span class="work-title">朔风向淮</span>
          </span>
          <span class="read-link">查看正文</span>
        </a>
      </div>
      
      <div class="catalog-list">
        <a class="work-card" href="guiqulai.html">
          <span class="work-year">固元十七年</span>
          <span>
            <span class="work-title">归去来</span>
          </span>
          <span class="read-link">查看正文</span>
        </a>
      </div>
    </section>

  </main>
</body>
</html>
